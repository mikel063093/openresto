name: test-rest

volumes:
  test_rest_db_data:
  test_rest_media_data:
  n8n_test_postgres_data:
  n8n_test_data:
  n8n_test_binary_data:
  n8n_test_sessions_data:
  n8n_test_dedupe_data:
  n8n_test_ordering_data:
  n8n_test_replay_data:
  n8n_test_outbound_data:

networks:
  test-rest-app-internal:
    internal: true
  test-rest-bot-internal:
    internal: true
  test-rest-egress:
    driver: bridge
  dokploy-network:
    external: true

services:
  backend:
    build:
      context: ./OpenRestoApi
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      PORT: 8080
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_KEY: ${JWT_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CONNECTION_STRING: Data Source=/data/openresto.db
      DATA_PROTECTION_KEYS_PATH: /data/dp-keys
      # Test is intentionally the only deployed environment that opts in to docs.
      # The backend still requires a SuperAdmin JWT or auth cookie for both docs URLs.
      OpenApi__ExposeDocs: "true"
    volumes:
      - test_rest_db_data:/data
      - test_rest_media_data:/app/wwwroot/media
    networks:
      test-rest-app-internal:
        aliases:
          - test-rest-backend
      test-rest-egress: {}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./openresto-frontend
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      EXPO_PUBLIC_API_URL: /api
    networks:
      test-rest-app-internal:
        aliases:
          - test-rest-frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  reverse-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: test-rest-reverse-proxy
    restart: unless-stopped
    environment:
      PORT: 80
      BACKEND_HOST: test-rest-backend
      BACKEND_PORT: 8080
      FRONTEND_HOST: test-rest-frontend
      FRONTEND_PORT: 8081
    volumes:
      - test_rest_media_data:/usr/share/nginx/html/media:ro
    networks:
      - test-rest-app-internal
      - dokploy-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  reservation-bot-test:
    build:
      context: ./OpenRestoReservationBot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      PORT: 8080
      ReservationBot__InternalCredential: ${ReservationBot__InternalCredential}
      ReservationBot__OpenResto__AvailabilityBaseUrl: http://test-rest-backend:8080
      ReservationBot__OpenResto__PrivateBaseUrl: http://test-rest-backend:8080
      ReservationBot__OpenResto__PrivateApiCredential: ${WhatsAppChannel__InternalCallerCredential}
      ReservationBot__OpenResto__TimeoutSeconds: ${ReservationBot__OpenResto__TimeoutSeconds:-15}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      test-rest-app-internal:
        aliases:
          - reservation-bot-test-backend
      test-rest-bot-internal:
        aliases:
          - reservation-bot-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  n8n-test-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_TEST_POSTGRES_PASSWORD}
    volumes:
      - n8n_test_postgres_data:/var/lib/postgresql/data
    networks:
      test-rest-bot-internal:
        aliases:
          - n8n-test-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  n8n-test-volume-init:
    image: alpine:3.22
    restart: "no"
    command:
      - sh
      - -lc
      - >
        mkdir -p /mnt/n8n-data /mnt/binary-data /mnt/sessions /mnt/dedupe /mnt/ordering /mnt/replay /mnt/outbound &&
        chown -R 1000:1000 /mnt/n8n-data /mnt/binary-data /mnt/sessions /mnt/dedupe /mnt/ordering /mnt/replay /mnt/outbound
    volumes:
      - n8n_test_data:/mnt/n8n-data
      - n8n_test_binary_data:/mnt/binary-data
      - n8n_test_sessions_data:/mnt/sessions
      - n8n_test_dedupe_data:/mnt/dedupe
      - n8n_test_ordering_data:/mnt/ordering
      - n8n_test_replay_data:/mnt/replay
      - n8n_test_outbound_data:/mnt/outbound

  n8n-test:
    image: docker.n8n.io/n8nio/n8n:${N8N_TEST_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      N8N_HOST: n8n-test
      N8N_PROTOCOL: http
      N8N_PORT: 5678
      # Phase 6 exposes only /webhook* through Traefik on a dedicated public host.
      # The editor/API remain private because no public router targets those paths.
      WEBHOOK_URL: ${N8N_TEST_WEBHOOK_BASE_URL}
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_TEST_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_TEST_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_TEST_BASIC_AUTH_PASSWORD}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_BINARY_DATA_STORAGE_PATH: /home/node/.n8n/binary-data
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-test-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_TEST_POSTGRES_PASSWORD}
    volumes:
      - n8n_test_data:/home/node/.n8n
      - n8n_test_binary_data:/home/node/.n8n/binary-data
      - n8n_test_sessions_data:/data/channel-state/sessions
      - n8n_test_dedupe_data:/data/channel-state/dedupe
      - n8n_test_ordering_data:/data/channel-state/ordering
      - n8n_test_replay_data:/data/channel-state/replay
      - n8n_test_outbound_data:/data/channel-state/outbound
      - ./n8n/test/workflows:/workflows:ro
    depends_on:
      n8n-test-postgres:
        condition: service_healthy
      n8n-test-volume-init:
        condition: service_completed_successfully
      reservation-bot-test:
        condition: service_healthy
    networks:
      test-rest-bot-internal:
        aliases:
          - n8n-test
      test-rest-egress: {}
      dokploy-network: {}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5678/healthz/readiness').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
