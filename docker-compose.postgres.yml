# PostgreSQL production overlay. Use only after the application image includes the
# Npgsql EF Core provider and PostgreSQL migrations; see docs/backup-restore.md.
#
# docker compose -f docker-compose.release.yml -f docker-compose.postgres.yml config
#
# PostgreSQL is intentionally not published to the host. Only the backend joins
# the internal database network.
volumes:
  postgres_data:

networks:
  postgres-internal:
    internal: true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the deployment environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  backend:
    environment:
      DATABASE_PROVIDER: postgres
      CONNECTION_STRING: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in the deployment environment};Username=${POSTGRES_USER:?Set POSTGRES_USER in the deployment environment};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment};Ssl Mode=Disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - postgres-internal
