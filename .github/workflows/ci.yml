name: CI

on:
  push:
    branches: [develop, release]
  pull_request:
    branches: [develop, release]

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write
  checks: write
  deployments: write

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openresto-frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openresto-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: Run Prettier Check
        run: npx prettier --check "**/*.{ts,tsx,js,json}"

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test -- --ci --coverage --forceExit

      - name: Enforce frontend total line coverage (80%)
        working-directory: ..
        run: python3 scripts/ci/require-coverage.py --format jest --report openresto-frontend/coverage/coverage-summary.json --minimum 80

      - name: Upload Frontend Coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: openresto-frontend/coverage/lcov.info
          flag-name: frontend
          parallel: true

      - name: Upload Frontend Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: openresto-frontend/coverage/

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run Tests with Coverage
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[OpenRestoApi]*"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate API coverage report
        # The API is the backend deployable in this workflow. Migration/tool assemblies
        # are covered by their dedicated PostgreSQL job and are excluded here so an
        # unexecuted helper assembly cannot dilute the API's total line gate.
        run: reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:"CoverageReport" -reporttypes:"Html;Cobertura;lcov" -assemblyfilters:"+OpenRestoApi;-OpenRestoApi.PostgresMigrations;-OpenRestoApi.PostgresMigrationTool;-OpenRestoReservationBot"

      - name: Enforce backend API total line coverage (80%)
        run: python3 scripts/ci/require-coverage.py --format cobertura --report CoverageReport/Cobertura.xml --minimum 80

      - name: Upload Backend Coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: CoverageReport/lcov.info
          flag-name: backend
          parallel: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "TestResults/*.trx"

      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: "CoverageReport/"

      - name: Backend Coverage Summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "CoverageReport/Cobertura.xml"
          badge: true
          format: markdown
          output: both

      - name: Add Coverage to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: code-coverage-results.md

  backend-postgres:
    name: Backend PostgreSQL Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --auth=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUN_POSTGRES_INTEGRATION_TESTS: "1"
      POSTGRES_TEST_BOOTSTRAP_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres;Ssl Mode=Disable
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run PostgreSQL-focused backend tests
        run: >
          dotnet test --no-build --configuration Release --verbosity normal
          --filter "FullyQualifiedName~OpenRestoApi.Tests.Postgres"

  coveralls:
    name: Coveralls Finish
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Finish Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  docker:
    name: Docker + ZAP
    runs-on: ubuntu-latest
    needs: [frontend, backend, backend-postgres]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Patch backend env file for CI
        run: |
          sed -i 's|CONNECTION_STRING=.*|CONNECTION_STRING=Data Source=/tmp/openresto.db|' \
            ./OpenRestoApi/.env.docker

      - name: Build all containers
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          for i in $(seq 1 90); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5062/api/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is ready (HTTP 200)!"
              exit 0
            fi

            EXITED=$(docker compose ps --status exited --quiet)
            if [ -n "$EXITED" ]; then
              echo "Error: One or more containers have exited!"
              docker compose ps
              docker compose logs
              exit 1
            fi

            echo "Attempt $i/90: Backend not ready yet (HTTP $STATUS)..."
            if [ $((i % 5)) -eq 0 ]; then
              docker compose ps
            fi
            sleep 2
          done
          echo "Error: Services failed to become ready after 180 seconds."
          docker compose ps
          docker compose logs
          exit 1

      - name: Verify backend responds via nginx
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5062/api/health)
          echo "GET /api/health -> $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Verify frontend responds via nginx
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5062/)
          echo "GET / -> $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Verify security headers present
        run: |
          HEADERS=$(curl -sD - -o /dev/null http://localhost:5062/api/health)
          echo "$HEADERS"
          echo "$HEADERS" | grep -qi "x-content-type-options: nosniff" || exit 1
          echo "$HEADERS" | grep -qi "x-frame-options: DENY" || exit 1

      - name: Verify OpenAPI spec reachable via nginx
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5062/openapi/v1.json)
          echo "GET /openapi/v1.json -> $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://localhost:5062/openapi/v1.json
          rules_file_name: .zap-rules.tsv
          cmd_options: >
            -a
            -j
            -l WARN
            -z "-config api.disablekey=true
            -config openapi.targetUrl=http://localhost:5062
            -config spider.maxDuration=2
            -config scanner.maxScanDurationInMins=5"
          allow_issue_writing: false
          fail_action: true

      - name: Show ZAP vulnerabilities
        if: failure()
        run: |
          if [ -f report_md.md ]; then
            cat report_md.md
            cat report_md.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No markdown report found."
          fi

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
          if-no-files-found: ignore

      - name: Debug nginx config on failure
        if: failure()
        run: |
          echo "=== Rendered Nginx config ==="
          docker compose exec -T reverse-proxy cat /etc/nginx/conf.d/default.conf || echo "Could not read config"
          echo "=== Full Nginx config dump ==="
          docker compose exec -T reverse-proxy nginx -T || echo "Could not dump config"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=100

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Patch backend env file for CI
        run: |
          sed -i 's|CONNECTION_STRING=.*|CONNECTION_STRING=Data Source=/tmp/openresto.db|' \
            ./OpenRestoApi/.env.docker

      - name: Build all containers
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          for i in $(seq 1 90); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5062/api/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is ready (HTTP 200)!"
              exit 0
            fi

            EXITED=$(docker compose ps --status exited --quiet)
            if [ -n "$EXITED" ]; then
              echo "Error: One or more containers have exited!"
              docker compose ps
              docker compose logs
              exit 1
            fi

            echo "Attempt $i/90: Backend not ready yet (HTTP $STATUS)..."
            if [ $((i % 5)) -eq 0 ]; then
              docker compose ps
            fi
            sleep 2
          done
          echo "Error: Services failed to become ready after 180 seconds."
          docker compose ps
          docker compose logs
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: openresto-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: openresto-frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: openresto-frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: openresto-frontend
        env:
          ADMIN_EMAIL: admin@openresto.com
          ADMIN_PASSWORD: change-me-before-use
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: openresto-frontend/playwright-report/
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=100

  deploy-test:
    name: Deploy isolated test environment
    needs: [frontend, backend, backend-postgres, docker, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux, openresto-deploy]
    environment:
      name: test
      url: https://test-rest.joypaw.tech
    concurrency:
      group: openresto-test-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Backup, deploy exact SHA, and verify test
        run: scripts/ci/deploy-environment.sh --environment test --sha "$GITHUB_SHA"

  publish-production-images:
    name: Publish immutable production images
    needs: [frontend, backend, backend-postgres, docker, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact-SHA images
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --push --provenance=true \
            --tag "$REGISTRY/openresto-backend:$TAG" --file OpenRestoApi/Dockerfile .
          docker buildx build --platform linux/amd64 --push --provenance=true \
            --tag "$REGISTRY/openresto-frontend:$TAG" --build-arg EXPO_PUBLIC_API_URL=/api \
            --file openresto-frontend/Dockerfile openresto-frontend
          docker buildx build --platform linux/amd64 --push --provenance=true \
            --tag "$REGISTRY/openresto-nginx:$TAG" --file nginx/Dockerfile nginx

  deploy-production:
    name: Deploy production
    needs: [frontend, backend, backend-postgres, docker, e2e, publish-production-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: [self-hosted, linux, openresto-deploy]
    environment:
      name: production
      url: https://elsabio.joypaw.tech
    concurrency:
      group: openresto-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Backup, deploy exact SHA, and verify production
        run: scripts/ci/deploy-environment.sh --environment production --sha "$GITHUB_SHA"
