name: Legacy deployment disabled

# Deployments are intentionally centralized in ci.yml so they cannot bypass
# coverage, test, backup, environment, or exact-SHA gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Use the gated CI/CD workflow
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Direct deployment is disabled. Merge through develop or release so ci.yml runs every required gate." >&2
          exit 1
